# R CMD check on Linux, macOS and Windows, following
# https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

      # Scene spec 0.2 to 0.4 output from cog_scene() (palette COGs, and
      # RGBA and YCbCr JPEG colour images) and the 0.1 scenes checked by the
      # scenespec validator, not only by the R tests' structural checks. Linux only: it has R, the package's dependencies and Node.
      - name: Validate written scenes with the scenespec validator
        if: runner.os == 'Linux'
        env:
          # A pinned scenespec commit (main after scene spec 0.4), so a spec
          # change cannot turn this check red unseen; bump it deliberately.
          SCENESPEC_SHA: fc3a786d57e6c3c5a95a310e56fa5051c5952525
        run: |
          R CMD INSTALL .
          Rscript tools/write-scenes.R "$RUNNER_TEMP/scenes"
          git clone https://github.com/allboa/scenespec "$RUNNER_TEMP/scenespec"
          cd "$RUNNER_TEMP/scenespec"
          git checkout --detach "$SCENESPEC_SHA"
          npm ci --no-audit --no-fund
          node scripts/validate.js "$RUNNER_TEMP"/scenes/*.json
